name: Minecraft Bot 24/7
on:
  push:
    branches: [ main ]
  workflow_dispatch: # يتيح لك تشغيله يدوياً بضغطة زر

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20' # مشروع Mindcraft يحتاج إصدار حديث
      - run: npm install
      - run: node main.js # هذا هو الملف الأساسي في مشروع Mindcraft
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MINECRAFT_HOST: 'gptoi.aternos.me'
          MINECRAFT_VERSION: '1.20.1'
          BOT_NAME: 'Fanoos_AI'
