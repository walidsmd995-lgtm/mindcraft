name: Minecraft Bot 24/7
on:
  push:
    branches: [ develop, main ]
  workflow_dispatch: # لتشغيل البوت يدوياً

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Start Mindcraft Bot
        run: node main.js 
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MINECRAFT_HOST: 'gptoi.aternos.me'
          MINECRAFT_PORT: '50962'
          MINECRAFT_VERSION: '1.20.1'
          BOT_NAME: 'Gemini'
          # إعدادات إضافية لمشروع Mindcraft ليعمل تلقائياً
          USE_GOOGLE_GEMINI: 'true'
          PROMPT_FILENAME: 'default.json'
