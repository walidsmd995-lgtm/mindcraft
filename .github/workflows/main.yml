name: Minecraft Bot 24/7
on:
  push:
    branches: [ develop, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Configure Mindcraft
        run: |
          # إنشاء ملف المفاتيح لإيقاف خطأ OpenAI
          echo '{"google": "${{ secrets.GEMINI_API_KEY }}"}' > keys.json
          
          # تعديل ملفات المشروع برمجياً لتغيير IP و Port أترنوس
          find src/ -type f -name "*.js" -exec sed -i 's/127.0.0.1/gptoi.aternos.me/g' {} +
          find src/ -type f -name "*.js" -exec sed -i 's/25565/50962/g' {} +

      - name: Start Mindcraft Bot
        run: node main.js 
        env:
          MODEL_PROVIDER: 'google'
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HOST: 'gptoi.aternos.me'
          PORT: '50962'
          VERSION: '1.20.1'
          BOT_NAME: 'Gemini'
