name: Minecraft Bot 24/7
on:
  push:
    branches: [ develop, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Start Mindcraft Bot
        run: node main.js 
        env:
          # حل مشكلة المفتاح: نخبره أننا نستخدم جوجل ونعطيه المفتاح الصحيح
          MODEL_PROVIDER: 'google'
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # حل مشكلة العنوان: نحدد السيرفر الخارجي بدقة
          MINECRAFT_HOST: 'gptoi.aternos.me'
          MINECRAFT_PORT: '50962'
          MINECRAFT_VERSION: '1.20.1'
          BOT_NAME: 'Gemini'
          # إعدادات إضافية لإجبار البوت على قراءة الإعدادات
          USE_CONFIG: 'false'
