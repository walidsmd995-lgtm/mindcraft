name: Minecraft Bots (GPT & Gemini)
on:
  push:
    branches: [ develop, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Configure Keys and Server
        run: |
          # إنشاء ملف المفاتيح لـ GPT و Gemini معاً لإيقاف أخطاء الـ API
          echo '{
            "openai": "${{ secrets.OPENAI_API_KEY }}",
            "google": "${{ secrets.GEMINI_API_KEY }}"
          }' > keys.json
          
          # تعديل ملفات المشروع برمجياً لإجبار البوتات على عنوان أترنوس والمنفذ 50962
          find src/ -type f -name "*.js" -exec sed -i 's/127.0.0.1/gptoi.aternos.me/g' {} +
          find src/ -type f -name "*.js" -exec sed -i 's/25565/50962/g' {} +

      - name: Start GPT Bot
        run: node main.js & # تشغيل بوت OpenAI في الخلفية
        env:
          MODEL_PROVIDER: 'openai'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HOST: 'gptoi.aternos.me'
          PORT: '50962'
          VERSION: '1.20.1'
          BOT_NAME: 'GPT'

      - name: Start Gemini Bot
        run: node main.js # تشغيل بوت Gemini
        env:
          MODEL_PROVIDER: 'google'
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HOST: 'gptoi.aternos.me'
          PORT: '50962'
          VERSION: '1.20.1'
          BOT_NAME: 'Gemini'
