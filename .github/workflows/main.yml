name: Minecraft Bot 24/7
on:
  push:
    branches: [ develop, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Start Mindcraft Bot
        run: node main.js 
        env:
          # إعدادات الذكاء الاصطناعي (Gemini)
          MODEL_PROVIDER: 'google'
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          
          # إعدادات الاتصال بسيرفر أترنوس (البيانات من صورتك)
          HOST: 'gptoi.aternos.me'
          PORT: '50962'
          VERSION: '1.20.1'
          
          # اسم البوت الجديد
          BOT_NAME: 'Gemini'
