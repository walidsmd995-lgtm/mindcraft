name: Minecraft Bots (GPT & Gemini)
on:
  push:
    branches: [ develop, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Overwrite Settings
        run: |
          # 1. إنشاء ملف المفاتيح
          echo '{"openai": "${{ secrets.OPENAI_API_KEY }}", "google": "${{ secrets.GEMINI_API_KEY }}"}' > keys.json
          
          # 2. مسح ملف الإعدادات القديم وكتابة إعدادات أترنوس الخاصة بك مباشرة
          echo "export default {
            host: 'gptoi.aternos.me',
            port: 50962,
            auth: 'offline',
            profiles: ['./profiles/gpt.json', './profiles/gemini.json'],
            load_memory: false,
            init_message: 'Hello! I am ready.',
            only_chat_with: []
          }" > settings.js

      - name: Run Bots
        run: |
          # تشغيل البوت الأول (GPT) في الخلفية
          MODEL_PROVIDER=openai BOT_NAME=GPT node main.js & 
          sleep 10
          # تشغيل البوت الثاني (Gemini)
          MODEL_PROVIDER=google BOT_NAME=Gemini node main.js
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
